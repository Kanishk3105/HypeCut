[project]
name = "hypecut-backend"
version = "0.1.0"
description = "HypeCut Local backend — local-first AI video clipping studio"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hypecut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
